# Day-to-day work happens on feature/* branches, which don't run anything here
# (tests are run locally before pushing). A run happens when:
#   - something is merged/pushed to main: tests, then the Docker image is built
#     and published to GitHub Container Registry
#     (ghcr.io/heyimdownhere/next-stop) for the server to pull;
#   - a pull request is opened or updated: tests only;
#   - it's started by hand from the Actions tab.
# Docs-only changes (README, TODO, docs/) don't run anything, and a newer push
# cancels a run still in progress for the same branch.
#
# Actions are pinned to commit SHAs (a tag can be moved to other code);
# Dependabot keeps the pins and the version comments up to date.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            requirements-lock.txt
      # The app's packages exactly as the image gets them (every file's hash
      # checked), then the test tools on top.
      - run: pip install --require-hashes -r requirements-lock.txt && pip install -r requirements-dev.txt
      - name: Known vulnerabilities in the app's packages
        run: pip-audit --strict --disable-pip -r requirements-lock.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - run: pytest -q

  # Builds the image and starts it, before anything is published: catches a
  # broken Dockerfile or entrypoint, and checks the app doesn't run as root.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          tags: next-stop:ci
          build-args: SECURITY_UPDATES=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
      - name: Start it and check
        run: |
          mkdir -p appdata && sudo touch appdata/settings.json   # a root-owned file, as older versions left
          docker run -d --name ns -p 8080:8080 -v "$PWD/appdata:/config" \
            -e MAP_DOWNLOAD=false -e CTA_ENABLED=false next-stop:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz || true)
            [ "$code" = 200 ] || [ "$code" = 503 ] && break
            sleep 2
          done
          echo "healthz: $code"; [ "$code" = 200 ] || [ "$code" = 503 ]
          test "$(docker exec ns stat -c %u /proc/1)" = 99
          test "$(stat -c %u appdata/settings.json)" = 99
          curl -sf -o /dev/null -D - http://127.0.0.1:8080/ | grep -i content-security-policy
      # Fails on HIGH/CRITICAL vulnerabilities that have a fix available (a newer
      # base image or package): those are worth an update before publishing.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: next-stop:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - if: failure()
        run: docker logs ns || true

  publish:
    needs: [test, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          # A signed record of how the image was built, and the list of what's in it.
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/next-stop:latest
            ghcr.io/${{ github.repository_owner }}/next-stop:${{ github.sha }}
          build-args: SECURITY_UPDATES=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
